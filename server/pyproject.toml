[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-coach"
version = "0.1.0"
description = "Local service backend for the lc-coach LeetCode practice extension"
readme = "../README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[project.scripts]
lc-coach = "lc_coach.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lc_coach*"]

[tool.setuptools.package-data]
lc_coach = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
